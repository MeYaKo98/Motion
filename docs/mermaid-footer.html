<script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

    mermaid.initialize({ startOnLoad: false, securityLevel: "loose" });

    const diagramStart = /^(flowchart|sequenceDiagram|classDiagram|stateDiagram|erDiagram|gantt|gitGraph|journey|pie|quadrantChart|timeline)\b/;

    window.addEventListener("DOMContentLoaded", () => {
        const blocks = document.querySelectorAll(".fragment, pre, code");
        const diagrams = [];

        for (const block of blocks) {
            const source = block.textContent.trim();
            if (!diagramStart.test(source) || block.closest(".mermaid")) {
                continue;
            }

            const diagram = document.createElement("div");
            diagram.className = "mermaid";
            diagram.textContent = source;
            block.replaceWith(diagram);
            diagrams.push(diagram);
        }

        if (diagrams.length > 0) {
            mermaid.run({ nodes: diagrams });
        }
    });
</script>
